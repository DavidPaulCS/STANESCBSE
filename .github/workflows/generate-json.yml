name: Generate Notes JSON

on:
  push:
    paths:
      - '**/study-notes/**'
      - '**/practice-programs/**'
      - '**/practical-files/**'
      - '**/general-docs/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate JSON files for each section
        run: |
          python3 <<EOF
          import os, json, glob
          
          # Base patterns to scan
          base_patterns = [
              "2027-class*-*/study-notes",
              "2027-class*-*/practice-programs",
              "2027-class*-*/practical-files",
              "2027-class*-*/general-docs"
          ]
          
          # Get all matching directories
          for pattern in base_patterns:
              for folder in glob.glob(pattern):
                  if not os.path.isdir(folder):
                      continue
                  
                  # Extract path components
                  parts = folder.split('/')
                  class_id = parts[0]  # e.g., "2027-class12-cs"
                  section = parts[1]   # e.g., "study-notes"
                  
                  # Scan files in this folder
                  files_list = []
                  for file in os.listdir(folder):
                      if file.startswith('.') or file == 'files.json':
                          continue
                      
                      # Determine category based on extension
                      if file.endswith('.pdf'):
                          category = 'pdf'
                      elif file.endswith('.py') or file.endswith('.ipynb') or file.endswith('.html'):
                          category = 'python'
                      elif file.endswith('.doc') or file.endswith('.docx'):
                          category = 'docs'
                      else:
                          category = 'others'
                      
                      files_list.append({
                          "file": file,
                          "category": category
                      })
                  
                  # Sort files
                  files_list.sort(key=lambda x: x["file"].lower())
                  
                  # Write files.json in the same folder
                  with open(f"{folder}/files.json", 'w') as f:
                      json.dump({"files": files_list}, f, indent=2)
          
          print("Generated files.json for all sections")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add **/files.json
          git commit -m "Auto update section files.json" || echo "No changes"
          git push
