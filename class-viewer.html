<!DOCTYPE html>
<html>
<head>
  <title>Stanes CBSE | Computer Science | Informatics Practices</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {font-family:'Segoe UI';margin:0;background:#f1f3f6;}
    .dark {background:#121212;color:white;}
    .dark .file {background:#1e1e1e;}
    .dark .bottom-nav {background:#1e1e1e;}
    
    .header {
      background:linear-gradient(135deg,#2a5298,#1e3c72);
      color:white;
      padding:14px;
      text-align:center;
    }
    .header .title {font-size:18px;font-weight:500;}
    .header .subtitle {font-size:14px;opacity:0.9;}
    
    .container {padding:10px;padding-bottom:70px;}
    input {
      width:100%;padding:10px;border-radius:12px;border:none;
      margin-bottom:10px;box-sizing:border-box;
    }
    .categories {
      display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;
    }
    .categories button {
      border:none;padding:6px 12px;border-radius:20px;
      background:#e0e0e0;cursor:pointer;white-space:nowrap;
    }
    .categories .active {
      background:#2a5298;color:white;
    }
    .section-title {
      font-size:14px;margin:10px 5px;
      font-weight:bold;color:#555;
    }
    .dark .section-title {color:#bbb;}
    
    .file {
      background:white;
      margin-bottom:10px;
      padding:12px;
      border-radius:16px;
      box-shadow:0 2px 6px rgba(0,0,0,0.08);
      cursor:pointer;
    }
    .file .top {
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .file .title {
      display:flex;
      align-items:center;
      font-size:14px;
      font-weight:500;
      flex:1;
    }
    .file .actions a {
      color:#2a5298;
      text-decoration:none;
      font-size:18px;
    }
    .dark .file .actions a {color:#9bbcff;}
    
    .bottom-nav {
      position:fixed;
      bottom:0;
      width:100%;
      background:white;
      display:flex;
      justify-content:space-around;
      padding:10px 0;
      box-shadow:0 -2px 6px rgba(0,0,0,0.1);
    }
    .dark .bottom-nav {background:#1e1e1e;}
    .bottom-nav a {color:inherit;text-decoration:none;}
    
    .back-link {
      color:white;
      text-decoration:none;
      font-size:18px;
      margin-right:10px;
    }
    .debug-info {
      background:#f0f0f0;
      padding:10px;
      margin:10px 0;
      border-radius:8px;
      font-size:12px;
      color:#333;
    }
    .dark .debug-info {
      background:#2a2a2a;
      color:#ccc;
    }
  </style>
</head>
<body>

<header class="header">
  <div style="display:flex;align-items:center;justify-content:center;gap:10px;">
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i></a>
    <div>
      <div class="title" id="pageTitle">Content</div>
      <div class="subtitle" id="pageSubtitle"></div>
    </div>
  </div>
</header>

<div class="container">
  <input type="text" id="search" placeholder="🔍 Search..." onkeyup="searchFiles()">
  
  <div class="categories">
    <button onclick="filterCategory('all')" class="active">All</button>
    <button onclick="filterCategory('pdf')">PDFs</button>
    <button onclick="filterCategory('python')">Python</button>
    <button onclick="filterCategory('docs')">Docs</button>
    <button onclick="filterCategory('others')">Others</button>
  </div>
  
  <div id="fileList"></div>
</div>

<div class="bottom-nav">
  <a href="index.html"><i class="fas fa-home"></i></a>
  <div onclick="toggleDark()"><i class="fas fa-moon"></i></div>
</div>

<script>
let allFiles = [];
let currentCategory = "all";

// Auto-detect base path
const basePath = window.location.pathname.includes('/STANESCBSE/') 
  ? '/STANESCBSE/' 
  : '/';

// Get parameters from URL
const urlParams = new URLSearchParams(window.location.search);
const classId = urlParams.get('class') || '2027-class12-cs';
const section = urlParams.get('section') || 'study-notes';

console.log('Loading files from:', `${basePath}${classId}/${section}/files.json`);

// Load the JSON file for this section
fetch(`${basePath}${classId}/${section}/files.json`)
  .then(res => {
    console.log('Response status:', res.status);
    if (!res.ok) throw new Error(`HTTP ${res.status}: files.json not found`);
    return res.json();
  })
  .then(data => {
    console.log('Loaded data:', data);
    console.log('Number of files:', data.files ? data.files.length : 0);
    
    allFiles = data.files || [];
    
    // Update page title
    const displayName = getDisplayName(classId, section);
    document.getElementById('pageTitle').textContent = displayName.title;
    document.getElementById('pageSubtitle').textContent = displayName.subtitle;
    
    renderFiles();
  })
  .catch(error => {
    console.error('Error loading files:', error);
    document.getElementById('fileList').innerHTML = `
      <div style="text-align:center;padding:20px;color:#666;">
        <p>⚠️ Error loading files</p>
        <p style="font-size:14px;">${error.message}</p>
        <p style="font-size:12px;margin-top:10px;color:#999;">
          Tried to load: ${basePath}${classId}/${section}/files.json
        </p>
      </div>
    `;
  });

function getDisplayName(classId, section) {
  const parts = classId.split('-');
  const year = parts[0];
  const classNum = parts[1].replace('class', '');
  const subject = parts[2].toUpperCase();
  
  const sectionNames = {
    'study-notes': 'Study Notes',
    'practice-programs': 'Worksheets, QPs, Practice Programs',
    'practical-files': 'Practical Files',
    'general-docs': 'General Docs'
  };
  
  const sectionDisplay = sectionNames[section] || section;
  
  return {
    title: `${sectionDisplay}`,
    subtitle: `${year} - Class ${classNum} ${subject}`
  };
}

function renderFiles() {
  let container = document.getElementById('fileList');
  container.innerHTML = '';
  
  let files = allFiles;
  
  if (currentCategory !== 'all') {
    files = files.filter(f => f.category === currentCategory);
  }
  
  console.log('Rendering files:', files.length, 'filtered from', allFiles.length);
  
  if (files.length === 0) {
    container.innerHTML = `
      <div style="text-align:center;padding:20px;color:#666;">
        <p>📂 No files found${currentCategory !== 'all' ? ` in category "${currentCategory}"` : ''}</p>
        <p style="font-size:14px;">Total files in all categories: ${allFiles.length}</p>
        ${allFiles.length > 0 ? `<div class="debug-info">All files: ${allFiles.map(f => f.file).join(', ')}</div>` : ''}
      </div>
    `;
    return;
  }
  
  container.innerHTML = `<div class="section-title">${files.length} files</div>`;
  
  files.forEach(file => {
    container.appendChild(createCard(file));
  });
}

function createCard(file) {
  const div = document.createElement('div');
  div.className = 'file';
  
  const icon = getFileIcon(file.file);
  const cleanName = decodeURIComponent(file.file).replace(/\.[^/.]+$/, '');
  
  div.onclick = function() {
    window.open(
      `${basePath}${classId}/${section}/${encodeURIComponent(file.file)}`,
      '_blank'
    );
  };
  
  div.innerHTML = `
    <div class="top">
      <div class="title">
        <span style="margin-right:8px;">${icon}</span>
        ${cleanName}
      </div>
      <div class="actions">
        <a href="${basePath}${classId}/${section}/${encodeURIComponent(file.file)}"
           download="${file.file}"
           onclick="event.stopPropagation();">
          <i class="fas fa-download"></i>
        </a>
      </div>
    </div>
  `;
  
  return div;
}

function getFileIcon(file) {
  if (file.endsWith('.pdf')) return '📕';
  if (file.endsWith('.py')) return '📜';
  if (file.endsWith('.ipynb')) return '📒';
  if (file.endsWith('.html')) return '🌐';
  if (file.endsWith('.doc') || file.endsWith('.docx')) return '📄';
  return '📃';
}

function filterCategory(category) {
  currentCategory = category;
  document.querySelectorAll('.categories button')
    .forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  renderFiles();
}

function searchFiles() {
  const input = document.getElementById('search').value.toLowerCase();
  const files = document.getElementsByClassName('file');
  
  for (let file of files) {
    const text = file.innerText.toLowerCase();
    file.style.display = text.includes(input) ? 'block' : 'none';
  }
}

function toggleDark() {
  document.body.classList.toggle('dark');
}
</script>

</body>
</html>
