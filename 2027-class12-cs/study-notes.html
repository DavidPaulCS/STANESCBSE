<!DOCTYPE html>
<html>
<head>
  <title>Study Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    body {font-family:'Segoe UI';margin:0;background:#f1f3f6;}
    .dark {background:#121212;color:white;}
    .header {background:linear-gradient(135deg,#2a5298,#1e3c72);color:white;padding:14px;text-align:center;}
    .header .title {font-size:18px;font-weight:500;}
    .container {padding:10px;padding-bottom:70px;}

    input {
      width:100%;padding:10px;border-radius:12px;border:none;
      margin-bottom:10px;box-sizing:border-box;
    }

    .categories {
      display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;
    }

    .categories button {
      border:none;padding:6px 12px;border-radius:20px;
      background:#e0e0e0;cursor:pointer;
    }

    .categories .active {
      background:#2a5298;color:white;
    }

    .section-title {
      font-size:14px;margin:10px 5px;
      font-weight:bold;color:#555;
    }

    .dark .section-title {color:#bbb;}

    .file {
      background:white;
      margin-bottom:10px;
      padding:12px;
      border-radius:16px;
      box-shadow:0 2px 6px rgba(0,0,0,0.08);
      cursor:pointer;
    }

    .dark .file {background:#1e1e1e;}

    .top {
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .title {
      display:flex;
      align-items:center;
      font-size:14px;
      font-weight:500;
      flex:1;
    }

    .actions a {
      color:#2a5298;
      text-decoration:none;
      font-size:18px;
    }

    .dark .actions a {
      color:#9bbcff;
    }

    .bottom-nav {
      position:fixed;
      bottom:0;
      width:100%;
      background:white;
      display:flex;
      justify-content:space-around;
      padding:10px 0;
      box-shadow:0 -2px 6px rgba(0,0,0,0.1);
    }

    .dark .bottom-nav {background:#1e1e1e;}
  </style>
</head>
<body>

<header class="header">
  <span class="title">📘 Study Notes</span>
</header>

<div class="container">

  <input type="text" id="search" placeholder="🔍 Search..." onkeyup="searchFiles()">

  <div class="categories">
    <button onclick="filterCategory('all')" class="active">All</button>
    <button onclick="filterCategory('pdf')">PDFs</button>
    <button onclick="filterCategory('python')">Python Files</button>
    <button onclick="filterCategory('docs')">Docs</button>
  </div>

  <div id="fileList"></div>

</div>

<div class="bottom-nav">
  <a href="/STANESCBSE/index.html">
    <i class="fas fa-home"></i>
  </a>
  <div onclick="toggleDark()">
    <i class="fas fa-moon"></i>
  </div>
</div>

<script>

let allNotes = [];
let currentCategory = "all";

fetch('/STANESCBSE/notes.json')
.then(res => res.json())
.then(data => {

  allNotes = data.notes.sort((a, b) => {

    const aNum = /^\\d/.test(a.file);
    const bNum = /^\\d/.test(b.file);

    if (aNum && !bNum) return -1;
    if (!aNum && bNum) return 1;

    return a.file.localeCompare(b.file, undefined, {
      numeric: true,
      sensitivity: 'base'
    });

  });

  renderNotes();
});

function renderNotes() {

  let container = document.getElementById("fileList");
  container.innerHTML = "";

  let notes = allNotes;

  if (currentCategory !== "all") {
    notes = notes.filter(n => n.category === currentCategory);
  }

  container.innerHTML = `<div class="section-title">All Notes</div>`;

  notes.forEach(note => {
    container.appendChild(createCard(note));
  });
}

function createCard(note) {

  let div = document.createElement("div");
  div.className = "file";

  let icon = getFileIcon(note.file);
  let cleanName = decodeURIComponent(note.file).replace(/\.[^/.]+$/, "");

  div.onclick = function() {
    window.open(
      `/STANESCBSE/2027-class12-cs/study-notes/${encodeURIComponent(note.file)}`,
      "_blank"
    );
  };

  div.innerHTML = `
    <div class="top">
      <div class="title">
        <span style="margin-right:8px;">${icon}</span>
        ${cleanName}
      </div>

      <div class="actions">
        <a href="/STANESCBSE/2027-class12-cs/study-notes/${encodeURIComponent(note.file)}"
           download="${note.file}"
           onclick="event.stopPropagation();">
          <i class="fas fa-download"></i>
        </a>
      </div>
    </div>
  `;

  return div;
}

function filterCategory(category) {

  currentCategory = category;

  document.querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

  event.target.classList.add("active");

  renderNotes();
}

function searchFiles() {

  let input = document.getElementById("search").value.toLowerCase();
  let files = document.getElementsByClassName("file");

  for (let i = 0; i < files.length; i++) {

    let text = files[i].innerText.toLowerCase();

    files[i].style.display =
      text.includes(input) ? "block" : "none";
  }
}

function getFileIcon(file) {

  if (file.endsWith(".pdf")) return "📕";
  if (file.endsWith(".py")) return "📜";
  if (file.endsWith(".ipynb")) return "📒";
  if (file.endsWith(".html")) return "📒";

  return "📃";
}

function toggleDark() {
  document.body.classList.toggle("dark");
}

</script>

</body>
</html>
