<!DOCTYPE html>
<html>
<head>
  <title>Stanes CBSE | Computer Science</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f1f3f6;
      transition: 0.3s;
    }

    .dark {
      background: #121212;
      color: white;
    }

    .dark .card {
      background: #1e1e1e;
    }

    .dark .links a {
      background: #2a2a2a;
      color: white;
    }

    .header {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .search-box {
      padding: 12px;
      text-align: center;
    }

    input {
      width: 90%;
      max-width: 400px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .container {
      padding: 12px;
      padding-bottom: 70px;
      display: grid;
      gap: 12px;
    }

    .card {
      background: white;
      padding: 14px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      animation: fadeIn 0.4s ease;
      transition: 0.2s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card h2 {
      margin: 0 0 10px 0;
      font-size: 17px;
      font-weight: 600;
      color: #1e3c72;
    }

    .dark .card h2 {
      color: #9bbcff;
    }

    .links a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0;
      padding: 10px;
      border-radius: 10px;
      text-decoration: none;
      background: #eef3ff;
      color: #2a5298;
      font-weight: 500;
      transition: 0.2s;
    }

    .links a:hover {
      background: #d6e4ff;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: center;
      padding: 12px 0;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
    }

    .bottom-nav i {
      font-size: 18px;
      cursor: pointer;
      color: #333;
    }

    .dark .bottom-nav {
      background: #1e1e1e;
      color: white;
    }

    .dark .bottom-nav i {
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<header class="header">
  Stanes CBSE - Computer Science Portal (Class XI & XII)
</header>

<div class="search-box">
  <input type="text" id="search" onkeyup="searchContent()" placeholder="🔍 Search class or subject...">
</div>

<div class="container" id="contentContainer">
  <!-- Will be populated dynamically -->
  <div style="text-align:center;padding:20px;color:#666;">
    <i class="fas fa-spinner fa-spin" style="font-size:24px;"></i>
    <p>Loading content...</p>
  </div>
</div>

<div class="bottom-nav">
  <i class="fas fa-moon" onclick="toggleDark()"></i>
</div>

<script>
// Auto-detect base path
const basePath = window.location.pathname.includes('/STANESCBSE/') 
  ? '/STANESCBSE/' 
  : '/';

// Load the content configuration
fetch(basePath + 'content.json')
  .then(res => {
    if (!res.ok) throw new Error('content.json not found');
    return res.json();
  })
  .then(data => {
    const container = document.getElementById('contentContainer');
    
    if (!data.classes || data.classes.length === 0) {
      container.innerHTML = '<p style="text-align:center;padding:20px;">No classes configured yet.</p>';
      return;
    }
    
    container.innerHTML = '';
    
    data.classes.forEach(cls => {
      const card = document.createElement('div');
      card.className = 'card';
      
      let linksHtml = '';
      cls.sections.forEach(section => {
        linksHtml += `
          <a href="${basePath}class-viewer.html?class=${cls.id}&section=${section.id}">
            ${section.icon} ${section.display} <span>›</span>
          </a>
        `;
      });
      
      card.innerHTML = `
        <h2>${cls.icon} ${cls.display}</h2>
        <div class="links">
          ${linksHtml}
        </div>
      `;
      
      container.appendChild(card);
    });
  })
  .catch(error => {
    console.error('Error loading content:', error);
    document.getElementById('contentContainer').innerHTML = `
      <div style="text-align:center;padding:20px;color:#666;">
        <p>⚠️ Unable to load content.</p>
        <p style="font-size:14px;">Make sure content.json exists in the root directory.</p>
        <p style="font-size:12px;margin-top:10px;color:#999;">Error: ${error.message}</p>
      </div>
    `;
  });

function searchContent() {
  const input = document.getElementById('search').value.toLowerCase();
  const cards = document.getElementsByClassName('card');
  
  for (let card of cards) {
    const text = card.innerText.toLowerCase();
    card.style.display = text.includes(input) ? 'block' : 'none';
  }
}

function toggleDark() {
  document.body.classList.toggle('dark');
  const icon = document.querySelector('.bottom-nav i');
  icon.classList.toggle('fa-moon');
  icon.classList.toggle('fa-sun');
}
</script>

</body>
</html>
